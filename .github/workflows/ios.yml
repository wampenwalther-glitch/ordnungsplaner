name: Local core and iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core persistence and session tests
        run: swift test --parallel
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator without signing
        run: >-
          xcodebuild -project Ordnungsplaner.xcodeproj
          -scheme Ordnungsplaner
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Launch app in iPhone Simulator
        run: bash scripts/simulator-smoke.sh
      - name: Build unsigned iPhone package
        run: bash scripts/package-unsigned.sh
      - name: Upload simulator screenshot and unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Ordnungsplaner-iPhone-Vorschau
          path: |
            build/Ordnungsplaner-Simulator.png
            build/Ordnungsplaner-unsigniert.ipa
          if-no-files-found: error
          retention-days: 14
