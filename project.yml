name: Ordnungsplaner
options:
  bundleIdPrefix: local.ordnungsplaner
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  OrderCore:
    path: .
targets:
  Ordnungsplaner:
    type: application
    platform: iOS
    sources:
      - path: ios
    dependencies:
      - package: OrderCore
        product: OrderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ordnungsplaner.app
        PRODUCT_NAME: Ordnungsplaner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Config/Info.plist
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Ordnungsplaner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Mit deiner Kamera dokumentierst du Räume und nimmst auf geeigneten Geräten einen LiDAR-Raumscan auf."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      gatherCoverageData: false
